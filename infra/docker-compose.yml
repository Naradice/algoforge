## Production — clean build from source, no volume mounts.
## All code is baked into images; deploy with confidence.
##
## First deploy or after dependency changes:
##   docker compose build
##   docker compose up -d
##
## Code-only changes (no requirements.txt / package.json change):
##   docker compose build --no-cache=false backend web celery-collection ...
##   docker compose up -d
##
## Rolling restart without downtime:
##   docker compose up -d --no-deps backend

x-backend-prod: &backend-prod
  build:
    context: ../../
    dockerfile: algoforge/backend/Dockerfile
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://algoforge:algoforge@postgres:5432/algoforge
    REDIS_URL: redis://redis:6379/0
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - artifacts:/app/artifacts
  restart: unless-stopped

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: algoforge
      POSTGRES_USER: algoforge
      POSTGRES_PASSWORD: algoforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algoforge"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    <<: *backend-prod
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        API_URL: http://backend:8000
    ports:
      - "3000:3000"
    environment:
      API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

  celery-collection:
    <<: *backend-prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.5"
    command: celery -A celery_worker worker -Q collection --concurrency=1 --pool=prefork --loglevel=info

  celery-characteristics:
    <<: *backend-prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: celery -A celery_worker worker -Q characteristics --concurrency=12 --pool=prefork --loglevel=info

  celery-training:
    <<: *backend-prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: celery -A celery_worker worker -Q training --concurrency=2 --pool=prefork --loglevel=info

  celery-backtest:
    <<: *backend-prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: celery -A celery_worker worker -Q backtest --concurrency=5 --pool=prefork --loglevel=info

  ml_worker:
    build:
      context: ../../
      dockerfile: algoforge/ml_worker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://algoforge:algoforge@postgres:5432/algoforge
      REDIS_URL: redis://redis:6379/0
      ARTIFACT_STORE_PATH: /app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - artifacts:/app/artifacts
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  artifacts:
