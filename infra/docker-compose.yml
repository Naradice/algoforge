services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: algoforge
      POSTGRES_USER: algoforge
      POSTGRES_PASSWORD: algoforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algoforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../../
      dockerfile: algoforge/backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://algoforge:algoforge@postgres:5432/algoforge
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    command: >
      sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        API_URL: http://backend:8000
    ports:
      - "3000:3000"
    environment:
      API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    depends_on:
      - backend

  # ── Celery workers — one service per queue for independent concurrency ──────

  celery-collection:
    build:
      context: ../../
      dockerfile: algoforge/backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://algoforge:algoforge@postgres:5432/algoforge
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - artifacts:/app/artifacts
    command: celery -A celery_worker worker -Q collection --concurrency=3 --pool=prefork --loglevel=info

  celery-characteristics:
    build:
      context: ../../
      dockerfile: algoforge/backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://algoforge:algoforge@postgres:5432/algoforge
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - artifacts:/app/artifacts
    command: celery -A celery_worker worker -Q characteristics --concurrency=12 --pool=prefork --loglevel=info

  celery-training:
    build:
      context: ../../
      dockerfile: algoforge/backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://algoforge:algoforge@postgres:5432/algoforge
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - artifacts:/app/artifacts
    command: celery -A celery_worker worker -Q training --concurrency=2 --pool=prefork --loglevel=info

  celery-backtest:
    build:
      context: ../../
      dockerfile: algoforge/backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://algoforge:algoforge@postgres:5432/algoforge
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - artifacts:/app/artifacts
    command: celery -A celery_worker worker -Q backtest --concurrency=5 --pool=prefork --loglevel=info

  ml_worker:
    build:
      context: ../../
      dockerfile: algoforge/ml_worker/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://algoforge:algoforge@postgres:5432/algoforge
      REDIS_URL: redis://redis:6379/0
      ARTIFACT_STORE_PATH: /app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - artifacts:/app/artifacts

volumes:
  postgres_data:
  redis_data:
  artifacts:
