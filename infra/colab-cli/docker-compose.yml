## Standalone service for google-colab-cli. Deliberately NOT part of ../docker-compose.dev.yml
## (which fronts algoforge's own backend/celery workers) -- this has nothing to do with them and
## should be startable/stoppable independently, with no risk of touching those services.
##
## First-time setup (one-time interactive login):
##   docker compose up -d
##   docker compose exec colab-cli colab auth --auth oauth2
## Follow the printed URL/instructions to authenticate; the resulting token is written into the
## colab_cli_config volume and survives `docker compose down` / container recreation (only
## `docker volume rm` clears it). If oauth2 doesn't work non-interactively in this container, try
## `--auth adc` instead (Application Default Credentials) -- unconfirmed which mode this CLI
## needs for a fully headless setup; see README.md for how to check.
##
## Usage, once authenticated -- see README.md for the full flow (colab run only takes .py
## scripts; a .ipynb notebook runs via `colab new` + `colab exec -f`):
##   docker compose exec colab-cli colab new -s <name>
##   docker compose exec colab-cli colab exec -s <name> -f /notebooks/<name>.ipynb --timeout 3600
##   docker compose exec colab-cli colab download -s <name> /content/best.pt /notebooks/<name>_best.pt
##   docker compose exec colab-cli colab stop -s <name>

services:
  colab-cli:
    build:
      context: .
      dockerfile: Dockerfile
    image: algoforge-colab-cli:dev
    volumes:
      - colab_cli_config:/root/.config/colab-cli
      # Notebooks generated by backend/scripts/generate_colab_notebook.py land here.
      - ../../notebooks:/notebooks
    stdin_open: true
    tty: true

volumes:
  colab_cli_config:
