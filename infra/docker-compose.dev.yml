## Local development — code is volume-mounted, no rebuild needed for code changes.
## Rebuild only when requirements.txt or package.json changes:
##   docker compose -f docker-compose.dev.yml build
##
## Start:
##   docker compose -f docker-compose.dev.yml up

x-backend-dev: &backend-dev
  build:
    context: ../../
    dockerfile: algoforge/infra/Dockerfile.backend-dev
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://algoforge:algoforge@postgres:5432/algoforge
    REDIS_URL: redis://redis:6379/0
    # Set ARTIFACT_REMOTE_URL in .env to enable write-through backup to object storage.
    # e.g. ARTIFACT_REMOTE_URL=s3://my-bucket/algoforge
    # Leave unset to use local-only storage (default).
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - ../backend:/app
    - artifacts:/app/artifacts
    - artifact_backup:/mnt/artifact_backup

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: algoforge
      POSTGRES_USER: algoforge
      POSTGRES_PASSWORD: algoforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algoforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    <<: *backend-dev
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  web:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      # Enable polling so Next.js detects file changes from Windows host via volume mount.
      # node_modules and .next are excluded from scanning in next.config.js to reduce memory use.
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLLING_INTERVAL: "2000"
      # Cap Node.js heap to prevent OOM kills; 768 MB is sufficient for Next.js dev.
      NODE_OPTIONS: "--max-old-space-size=768"
    depends_on:
      - backend
    volumes:
      - ../web:/app
      - web_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    mem_limit: 1g

  celery-collection:
    <<: *backend-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    # concurrency=2: one slot for long-running DDM simulations, one for other
    # collection tasks (web_report, ohlc). Without two slots, an endless DDM job
    # occupies the only ForkPoolWorker and all other collection tasks queue
    # forever — they show as "idle" even after manual runs.
    # cpus=1.5: DO NOT raise this. A DDM job alone saturates ~1 CPU; the cap
    # keeps total CPU at 150% when both slots are busy. Raising cpus does not
    # speed up DDM (it's single-threaded) and causes ~200% CPU usage in dev.
    command: celery -A celery_worker worker -Q collection --concurrency=2 --pool=prefork --loglevel=info
    cpus: "1.5"

  celery-characteristics:
    <<: *backend-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: celery -A celery_worker worker -Q characteristics --concurrency=12 --pool=prefork --loglevel=info

  celery-training:
    <<: *backend-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: celery -A celery_worker worker -Q training --concurrency=2 --pool=prefork --loglevel=info

  celery-backtest:
    <<: *backend-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: celery -A celery_worker worker -Q backtest --concurrency=5 --pool=prefork --loglevel=info

volumes:
  postgres_data:
  redis_data:
  artifacts:
  web_node_modules:
  artifact_backup:
    driver: local
