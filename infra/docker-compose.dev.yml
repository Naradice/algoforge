## Local development — code is volume-mounted, no rebuild needed for code changes.
## Rebuild only when requirements.txt or package.json changes:
##   docker compose -f docker-compose.dev.yml build
##
## Start:
##   docker compose -f docker-compose.dev.yml up

x-backend-dev: &backend-dev
  build:
    context: ../../
    dockerfile: algoforge/infra/Dockerfile.backend-dev-slim
  image: algoforge-backend-slim:dev
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://algoforge:algoforge@postgres:5432/algoforge
    REDIS_URL: redis://redis:6379/0
    # Set ARTIFACT_REMOTE_URL in .env to enable write-through backup to object storage.
    # e.g. ARTIFACT_REMOTE_URL=s3://my-bucket/algoforge
    # Leave unset to use local-only storage (default).
    # finance_client source is volume-mounted and takes precedence over the installed package,
    # so YAML config files and code changes are picked up without a rebuild.
    # PYTHONPATH: /finance_client_src  # disabled: P9 bind-mount over WSL2 causes import stalls
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - ../backend:/app
    - ../../finance_client/src:/finance_client_src
    - artifacts:/app/artifacts
    - artifact_backup:/mnt/artifact_backup

x-backend-dev-full: &backend-dev-full
  build:
    context: ../../
    dockerfile: algoforge/infra/Dockerfile.backend-dev
  image: algoforge-backend-collection:dev
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://algoforge:algoforge@postgres:5432/algoforge
    REDIS_URL: redis://redis:6379/0
    # PYTHONPATH: /finance_client_src  # disabled: P9 bind-mount over WSL2 causes import stalls
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - ../backend:/app
    - ../../finance_client/src:/finance_client_src
    - artifacts:/app/artifacts
    - artifact_backup:/mnt/artifact_backup

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: algoforge
      POSTGRES_USER: algoforge
      POSTGRES_PASSWORD: algoforge
      # Dev-only: skip fsync so the first-run WAL checkpoint doesn't time out on WSL2.
      # Never use these in production.
      POSTGRES_INITDB_ARGS: "--no-sync --set=fsync=off --set=synchronous_commit=off --set=full_page_writes=off"
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algoforge"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 300s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    <<: *backend-dev
    restart: on-failure:5
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # On Docker Desktop, backtests and collection jobs update /app/artifacts while
    # uvicorn --reload is watching /app. Exclude generated artifacts so backend
    # hot reload only tracks source files and does not crash or restart mid-run.
    command:
      - sh
      - -c
      - "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-exclude 'artifacts/*' --reload-exclude 'artifacts/**'"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 900s

  web:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      # Polling is opt-in because Docker Desktop bind mounts + Watchpack polling can
      # exhaust memory during the initial scan and cause proxy resets in next dev.
      # Set WATCHPACK_POLLING=true in infra/.env only if file changes are not detected.
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-false}
      WATCHPACK_POLLING_INTERVAL: ${WATCHPACK_POLLING_INTERVAL:-15000}
      # Keep the dev server below the container memory limit.
      NODE_OPTIONS: "--max-old-space-size=1536"
    depends_on:
      - backend
    volumes:
      - ../web:/app
      - web_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    mem_limit: 2g

  celery-collection:
    <<: *backend-dev-full
    restart: on-failure:5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    # concurrency=2: one slot for long-running DDM simulations, one for other
    # collection tasks (web_report, ohlc). Without two slots, an endless DDM job
    # occupies the only ForkPoolWorker and all other collection tasks queue
    # forever — they show as "idle" even after manual runs.
    # cpus=1.5: DO NOT raise this. A DDM job alone saturates ~1 CPU; the cap
    # keeps total CPU at 150% when both slots are busy. Raising cpus does not
    # speed up DDM (it's single-threaded) and causes ~200% CPU usage in dev.
    command: celery -A celery_worker worker -Q collection --concurrency=2 --pool=prefork --loglevel=info
    cpus: "1.5"

  celery-characteristics:
    <<: *backend-dev
    restart: on-failure:5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: celery -A celery_worker worker -Q characteristics --concurrency=12 --pool=prefork --loglevel=info

  celery-training:
    <<: *backend-dev
    restart: on-failure:5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: celery -A celery_worker worker -Q training --concurrency=2 --pool=prefork --loglevel=info

  celery-backtest:
    <<: *backend-dev
    restart: on-failure:5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command: celery -A celery_worker worker -Q backtest --concurrency=5 --pool=prefork --loglevel=info

volumes:
  postgres_data:
  redis_data:
  artifacts:
  web_node_modules:
  artifact_backup:
    driver: local
